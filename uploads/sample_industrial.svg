<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="smog-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="factory-brick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="800" height="340" fill="url(#smog-sky)" />
  <rect y="320" width="800" height="180" fill="#0f172a" />

  <!-- Dense Smoke clouds -->
  <ellipse cx="250" cy="100" rx="160" ry="80" fill="#334155" opacity="0.8" />
  <ellipse cx="380" cy="70" rx="190" ry="90" fill="#1e293b" opacity="0.75" />
  <ellipse cx="520" cy="110" rx="170" ry="75" fill="#475569" opacity="0.85" />
  <ellipse cx="650" cy="80" rx="140" ry="70" fill="#1e293b" opacity="0.7" />

  <!-- Factory Buildings -->
  <polygon points="100,320 180,240 260,320" fill="url(#factory-brick)" />
  <polygon points="260,320 340,240 420,320" fill="url(#factory-brick)" />
  <rect x="100" y="270" width="320" height="100" fill="url(#factory-brick)" />

  <!-- Industrial Stacks / Chimneys with continuous billows -->
  <rect x="230" y="140" width="35" height="150" fill="#475569" stroke="#1e293b" stroke-width="2"/>
  <rect x="360" y="110" width="40" height="180" fill="#334155" stroke="#0f172a" stroke-width="2"/>
  <rect x="490" y="160" width="30" height="130" fill="#475569" stroke="#1e293b" stroke-width="2"/>

  <!-- Emission Plumes from chimneys -->
  <path d="M230,140 C210,90 280,60 250,20 C290,40 310,90 265,140 Z" fill="#1e293b" opacity="0.9"/>
  <path d="M360,110 C330,50 420,30 380,0 C430,20 450,60 400,110 Z" fill="#0f172a" opacity="0.95"/>
  <path d="M490,160 C470,110 540,80 510,40 C550,60 570,110 520,160 Z" fill="#334155" opacity="0.9"/>

  <!-- Factory windows with internal orange heat glow -->
  <rect x="140" y="290" width="20" height="30" fill="#f97316" opacity="0.8"/>
  <rect x="180" y="290" width="20" height="30" fill="#f97316" opacity="0.8"/>
  <rect x="290" y="290" width="20" height="30" fill="#f97316" opacity="0.8"/>
  <rect x="330" y="290" width="20" height="30" fill="#f97316" opacity="0.8"/>

  <!-- Geo-tag Overlay -->
  <rect x="25" y="25" width="330" height="70" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <circle cx="50" cy="50" r="10" fill="#64748b" />
  <text x="70" y="48" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">EVIDENCE: INDUSTRIAL AIR EMISSIONS</text>
  <text x="70" y="68" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">📍 19.1762° N, 72.9525° E • Bhandup Industrial Zone</text>
  
  <rect x="620" y="25" width="155" height="35" rx="8" fill="rgba(249, 115, 22, 0.9)" />
  <text x="697" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" text-anchor="middle">HIGH EMISSION</text>
</svg>
