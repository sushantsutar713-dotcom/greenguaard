<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="forest-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="forest-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="stump-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>
  <rect width="800" height="320" fill="url(#forest-sky)" />
  <rect y="300" width="800" height="200" fill="url(#forest-ground)" />
  
  <!-- Living Trees in Background -->
  <polygon points="80,310 130,120 180,310" fill="#14532d" opacity="0.8"/>
  <polygon points="100,280 140,90 180,280" fill="#166534" opacity="0.9"/>
  <polygon points="650,320 710,100 770,320" fill="#14532d" opacity="0.8"/>
  <polygon points="620,290 680,120 740,290" fill="#166534" opacity="0.9"/>
  
  <!-- Cut Down Massive Tree Trunks on Ground -->
  <!-- Stump 1 -->
  <ellipse cx="260" cy="380" rx="60" ry="25" fill="url(#stump-wood)" stroke="#92400e" stroke-width="3"/>
  <ellipse cx="260" cy="380" rx="45" ry="18" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <ellipse cx="260" cy="380" rx="25" ry="10" fill="#d97706" />
  <path d="M200,380 L200,430 C200,450 320,450 320,430 L320,380 Z" fill="#78350f" />

  <!-- Fallen Massive Trunk across frame -->
  <polygon points="300,390 700,340 710,380 310,430" fill="#5c2c08" stroke="#451a03" stroke-width="2"/>
  <ellipse cx="705" cy="360" rx="15" ry="20" fill="#b45309" />
  
  <!-- Sawdust and scattered logs -->
  <ellipse cx="370" cy="440" rx="90" ry="20" fill="#d97706" opacity="0.6"/>
  <rect x="420" y="410" width="120" height="25" rx="5" fill="#78350f" transform="rotate(15 420 410)"/>
  <rect x="500" y="420" width="100" height="20" rx="4" fill="#92400e" transform="rotate(-8 500 420)"/>

  <!-- Warning tape -->
  <line x1="150" y1="360" x2="450" y2="460" stroke="#facc15" stroke-width="6" stroke-dasharray="25, 10" />

  <!-- Geo-tag Overlay -->
  <rect x="25" y="25" width="320" height="70" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <circle cx="50" cy="50" r="10" fill="#f97316" />
  <text x="70" y="48" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">EVIDENCE: ILLEGAL TREE FELLING</text>
  <text x="70" y="68" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">📍 19.1136° N, 72.8697° E • Aarey Forest</text>
  
  <rect x="620" y="25" width="155" height="35" rx="8" fill="rgba(249, 115, 22, 0.9)" />
  <text x="697" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" text-anchor="middle">HIGH SEVERITY</text>
</svg>
