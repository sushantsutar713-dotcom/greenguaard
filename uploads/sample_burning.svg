<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="night-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <radialGradient id="fire-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(249, 115, 22, 0.4)" />
      <stop offset="100%" stop-color="rgba(249, 115, 22, 0)" />
    </radialGradient>
  </defs>
  <rect width="800" height="350" fill="url(#night-sky)" />
  <rect y="330" width="800" height="170" fill="#090d16" />

  <!-- Background residential outlines -->
  <rect x="50" y="240" width="120" height="90" fill="#1e293b" opacity="0.6"/>
  <rect x="620" y="220" width="140" height="110" fill="#1e293b" opacity="0.6"/>
  
  <!-- Thick Smoke Plumes -->
  <ellipse cx="400" cy="180" rx="180" ry="120" fill="#334155" opacity="0.7" filter="blur(10px)"/>
  <ellipse cx="430" cy="120" rx="140" ry="90" fill="#1e293b" opacity="0.8" />
  <ellipse cx="370" cy="80" rx="110" ry="60" fill="#0f172a" opacity="0.85" />
  
  <!-- Fire Glow -->
  <circle cx="400" cy="320" r="180" fill="url(#fire-glow)" />
  
  <!-- Burning Trash Mound -->
  <ellipse cx="400" cy="380" rx="140" ry="45" fill="#18181b" />
  
  <!-- Flames -->
  <path d="M300,370 Q350,260 380,310 Q400,200 420,290 Q460,230 480,340 Q510,310 490,370 Z" fill="url(#fire)" />
  <path d="M340,360 Q380,270 400,300 Q415,220 435,320 Q460,280 470,360 Z" fill="#fde047" opacity="0.9"/>
  <path d="M380,350 Q400,280 410,320 Q420,260 430,350 Z" fill="#ffffff" opacity="0.8"/>

  <!-- Geo-tag Overlay -->
  <rect x="25" y="25" width="310" height="70" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <circle cx="50" cy="50" r="10" fill="#eab308" />
  <text x="70" y="48" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">EVIDENCE: OPEN WASTE BURNING</text>
  <text x="70" y="68" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">📍 19.0330° N, 73.0297° E • Navi Mumbai</text>
  
  <rect x="620" y="25" width="155" height="35" rx="8" fill="rgba(16, 185, 129, 0.9)" />
  <text x="697" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" text-anchor="middle">RESOLVED ACTION</text>
</svg>
