  <!-- River Water edge -->
  <path d="M0,350 C300,370 500,340 800,380 L800,500 L0,500 Z" fill="#0f2b38" />
  <path d="M0,370 C250,390 550,360 800,410 L800,500 L0,500 Z" fill="#0d202b" />
  
