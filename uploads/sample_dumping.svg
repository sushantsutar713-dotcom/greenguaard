  <text x="70" y="48" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">EVIDENCE: ILLEGAL DUMPING</text>
  <text x="70" y="68" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">📍 19.0760° N, 72.8777° E • Mithi River</text>
  
  <rect x="620" y="25" width="155" height="35" rx="8" fill="rgba(239, 68, 68, 0.9)" />
  <text x="697" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" text-anchor="middle">CRITICAL RISK</text>
