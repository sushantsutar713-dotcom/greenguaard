  <polygon points="220,390 390,210 520,400" fill="#94a3b8" />
  <polygon points="410,410 560,240 680,410" fill="url(#debris1)" />
  <polygon points="300,420 480,260 620,430" fill="#64748b" opacity="0.9"/>
  
  <!-- Trash bags and plastic barrels -->
