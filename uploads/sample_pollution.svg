<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="drain-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="toxic-effluent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <linearGradient id="pipe-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="800" height="260" fill="url(#drain-wall)" />
  <rect y="240" width="800" height="260" fill="#0c4a6e" />

  <!-- Industrial concrete culvert -->
  <rect x="0" y="180" width="800" height="70" fill="#334155" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Massive Industrial Discharge Pipe -->
  <rect x="280" y="100" width="240" height="110" rx="10" fill="url(#pipe-metal)" stroke="#1e293b" stroke-width="3"/>
  <ellipse cx="400" cy="210" rx="120" ry="30" fill="#0f172a" stroke="#475569" stroke-width="4"/>
  
  <!-- Toxic Liquid Gushing Out -->
  <path d="M300,210 C320,300 340,330 200,450 L600,450 C460,330 480,300 500,210 Z" fill="url(#toxic-effluent)" opacity="0.9"/>
  <ellipse cx="400" cy="420" rx="300" ry="60" fill="url(#toxic-effluent)" opacity="0.85" />
  
  <!-- Foam and chemical bubbles -->
  <circle cx="320" cy="380" r="18" fill="#fef08a" opacity="0.8"/>
  <circle cx="480" cy="400" r="22" fill="#fed7aa" opacity="0.75"/>
  <circle cx="410" cy="360" r="14" fill="#d9f99d" opacity="0.9"/>
  <circle cx="260" cy="430" r="28" fill="#fef08a" opacity="0.6"/>
  <circle cx="530" cy="420" r="25" fill="#fdba74" opacity="0.7"/>

  <!-- Geo-tag Overlay -->
  <rect x="25" y="25" width="330" height="70" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <circle cx="50" cy="50" r="10" fill="#ea580c" />
  <text x="70" y="48" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">EVIDENCE: TOXIC EFFLUENT DISCHARGE</text>
  <text x="70" y="68" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">📍 19.2183° N, 72.9781° E • Wagle Estate, Thane</text>
  
  <rect x="620" y="25" width="155" height="35" rx="8" fill="rgba(239, 68, 68, 0.9)" />
  <text x="697" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" text-anchor="middle">HIGH PRIORITY</text>
</svg>
